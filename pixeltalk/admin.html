<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PixelTalk Admin</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,Helvetica,sans-serif;
background:#12002f;
background-image:
linear-gradient(135deg,#12002f,#22004f,#12002f);
color:white;
padding:20px;
min-height:100vh;
}

.container{
max-width:800px;
margin:auto;
}

.card{
background:#1d0b3b;
border:3px solid #ff4fb2;
border-radius:12px;
padding:20px;
box-shadow:0 0 20px rgba(255,0,150,.35);
}

h1{
text-align:center;
margin-bottom:10px;
color:#ff67c4;
}

.subtitle{
text-align:center;
margin-bottom:25px;
color:#9ee7ff;
}

input{
width:100%;
padding:15px;
margin:15px 0;
font-size:18px;
border:none;
border-radius:8px;
outline:none;
background:#2c1655;
color:white;
}

button{
width:100%;
padding:15px;
font-size:18px;
font-weight:bold;
background:#ff4fb2;
border:none;
border-radius:8px;
color:white;
cursor:pointer;
transition:.2s;
}

button:hover{
background:#ff77c8;
}

#loginMessage{
margin-top:15px;
text-align:center;
font-weight:bold;
}

#inbox{
display:none;
}

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

.logout{
width:auto;
padding:10px 15px;
background:#ff4b6e;
}

.messageCard{
background:#29124d;
border-left:5px solid #ff4fb2;
padding:15px;
margin-bottom:15px;
border-radius:8px;
}

.messageCard p{
font-size:18px;
margin-bottom:10px;
white-space:pre-wrap;
}

.messageCard small{
color:#c9b7ff;
}

.empty{
text-align:center;
padding:30px;
opacity:.7;
}
</style>

</head>

<body>

<div class="container">

<div class="card" id="loginPanel">

<h1>🎮 PixelTalk</h1>

<p class="subtitle">
Private Admin Panel
</p>

<input
type="password"
id="pin"
placeholder="Enter Admin PIN">

<button id="loginBtn">
Unlock Inbox
</button>

<div id="loginMessage"></div>

</div>

<div class="card" id="inbox">

<div class="topbar">

<h2>💌 Anonymous Messages</h2>

<button
class="logout"
id="logoutButton">
Logout
</button>

</div>

<div id="messagesList">

<div class="empty">

Loading...

</div>

</div>

</div>

<script type="module">

// ==============================
// FIREBASE IMPORTS
// ==============================

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getFirestore,
  collection,
  query,
  orderBy,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

// ==============================
// FIREBASE CONFIG
// ==============================

const firebaseConfig = {
  apiKey: "AIzaSyDmyY0J2uDjTJHfwTKPJIetLpZu_8j-2t0",
  authDomain: "pixeltalk-web.firebaseapp.com",
  projectId: "pixeltalk-web",
  storageBucket: "pixeltalk-web.firebasestorage.app",
  messagingSenderId: "212734467277",
  appId: "1:212734467277:web:2521c220cbb551ab54dd84"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// ==============================
// ADMIN PIN
// ==============================

const ADMIN_PIN = "041107";

// ==============================
// ELEMENTS
// ==============================

const loginPanel = document.getElementById("loginPanel");
const inbox = document.getElementById("inbox");
const pin = document.getElementById("pin");
const loginBtn = document.getElementById("loginBtn");
const loginMessage = document.getElementById("loginMessage");
const logoutButton = document.getElementById("logoutButton");
const messagesList = document.getElementById("messagesList");

// ==============================
// AUTO LOGIN
// ==============================

if (sessionStorage.getItem("pixeltalk_admin") === "true") {
  showInbox();
}

// ==============================
// LOGIN
// ==============================

loginBtn.addEventListener("click", () => {

  if (pin.value === ADMIN_PIN) {

    sessionStorage.setItem("pixeltalk_admin", "true");

    showInbox();

  } else {

    loginMessage.textContent = "❌ Wrong PIN";
    pin.value = "";

  }

});

// ==============================
// SHOW INBOX
// ==============================

function showInbox() {

  loginPanel.style.display = "none";
  inbox.style.display = "block";

  loadMessages();

}

// ==============================
// LOGOUT
// ==============================

logoutButton.addEventListener("click", () => {

  sessionStorage.removeItem("pixeltalk_admin");

  location.reload();

});

// ==============================
// LOAD FIRESTORE
// ==============================

function loadMessages() {

  const q = query(
    collection(db, "messages"),
    orderBy("createdAt", "desc")
  );

  onSnapshot(
    q,

    (snapshot) => {

      messagesList.innerHTML = "";

      if (snapshot.empty) {

        messagesList.innerHTML = `
          <div class="empty">
            📭 No messages yet.
          </div>
        `;

        return;

      }

      snapshot.forEach((doc) => {

        const data = doc.data();

        const card = document.createElement("div");
        card.className = "messageCard";

        const text = document.createElement("p");
        text.textContent = data.message || "";

        const date = document.createElement("small");

        if (data.createdAt) {

          date.textContent =
            data.createdAt.toDate().toLocaleString();

        } else {

          date.textContent = "Just now";

        }

        card.appendChild(text);
        card.appendChild(date);

        messagesList.appendChild(card);

      });

    },

    (error) => {

      messagesList.innerHTML = `
        <div class="empty">
          ❌ ${error.message}
        </div>
      `;

      console.error(error);

    }

  );

}

</script>

</body>
</html>
