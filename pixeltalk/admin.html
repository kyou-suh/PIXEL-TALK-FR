<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PixelTalk Admin</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap"
    rel="stylesheet"
  >

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      padding: 25px;

      font-family: "VT323", monospace;
      color: white;

      background:
        radial-gradient(circle at 20% 20%, #51248f 0%, transparent 25%),
        radial-gradient(circle at 80% 80%, #8b174e 0%, transparent 30%),
        linear-gradient(135deg, #090021, #160039 45%, #09001f);
    }

    .container {
      width: min(700px, 100%);
      margin: auto;
    }

    .header {
      text-align: center;
      margin: 30px 0;
    }

    .header h1 {
      font-family: "Press Start 2P", monospace;
      font-size: clamp(22px, 6vw, 38px);
      color: #ff65bd;
      text-shadow: 4px 4px 0 #6324a5;
    }

    .header p {
      margin-top: 15px;
      font-size: 21px;
      color: #8eeeff;
    }

    .panel {
      padding: 25px;

      background: rgba(20, 5, 40, 0.95);

      border: 3px solid #ff55b8;

      box-shadow:
        7px 7px 0 #512090,
        0 0 25px rgba(255, 62, 185, .2);
    }

    .panel h2 {
      font-family: "Press Start 2P", monospace;
      font-size: 13px;
      color: #79eaff;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 15px;
      margin-bottom: 15px;

      border: 2px solid #8b4bd3;
      outline: none;

      background: #080516;
      color: white;

      font-family: "VT323", monospace;
      font-size: 21px;
    }

    input:focus {
      border-color: #ff5cbd;
    }

    button {
      width: 100%;
      padding: 16px;

      border: 3px solid white;

      background: #ff3eaa;
      color: white;

      font-family: "Press Start 2P", monospace;
      font-size: 10px;

      cursor: pointer;

      box-shadow: 5px 5px 0 #6c279b;
    }

    button:hover {
      background: #ff64bd;
    }

    .message {
      margin-top: 18px;
      text-align: center;
      font-size: 20px;
    }

    .error {
      color: #ff829f;
    }

    .success {
      color: #8dffbd;
    }

    #inbox {
      display: none;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;

      margin-bottom: 20px;
    }

    .top-bar h2 {
      margin: 0;
    }

    #logoutButton {
      width: auto;
      padding: 10px 14px;
      font-size: 8px;
      box-shadow: 3px 3px 0 #6c279b;
    }

    .rant {
      margin-bottom: 18px;
      padding: 18px;

      background: #100622;

      border: 2px solid #713bb0;

      box-shadow: 4px 4px 0 #2e1550;
    }

    .rant p {
      font-size: 23px;
      line-height: 1.15;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .rant small {
      display: block;
      margin-top: 12px;

      color: #9f8caf;
      font-size: 17px;
    }

    .empty {
      text-align: center;
      padding: 30px 10px;

      color: #a994b7;
      font-size: 21px;
    }

    @media (max-width: 500px) {
      body {
        padding: 15px;
      }

      .panel {
        padding: 18px;
      }

      .top-bar {
        align-items: flex-start;
      }

      #logoutButton {
        font-size: 7px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <header class="header">
      <h1>PIXELTALK</h1>
      <p>🔐 ADMIN CONTROL ROOM</p>
    </header>


    <!-- LOGIN -->
    <section class="panel" id="loginPanel">

      <h2>👾 ADMIN LOGIN</h2>

      <form id="loginForm">

        <input
          type="email"
          id="email"
          placeholder="Admin email"
          autocomplete="email"
          required
        >

        <input
          type="password"
          id="password"
          placeholder="Password"
          autocomplete="current-password"
          required
        >

        <button type="submit">
          🎮 LOGIN
        </button>

      </form>

      <div id="loginMessage" class="message"></div>

    </section>


    <!-- PRIVATE INBOX -->
    <section class="panel" id="inbox">

      <div class="top-bar">

        <h2>💌 RANT INBOX</h2>

        <button id="logoutButton">
          LOGOUT
        </button>

      </div>

      <div id="messagesList"></div>

    </section>

  </main>


  <script type="module">

    // ============================================
    // FIREBASE
    // ============================================

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

    import {
      getFirestore,
      collection,
      query,
      orderBy,
      onSnapshot
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    // ============================================
    // FIREBASE CONFIG
    // ============================================

    const firebaseConfig = {

      apiKey:
        "AIzaSyDmyY0J2uDjTJHfwTKPJIetLpZu_8j-2t0",

      authDomain:
        "pixeltalk-web.firebaseapp.com",

      projectId:
        "pixeltalk-web",

      storageBucket:
        "pixeltalk-web.firebasestorage.app",

      messagingSenderId:
        "212734467277",

      appId:
        "1:212734467277:web:2521c220cbb551ab54dd84",

      measurementId:
        "G-33DH0JJNN1"

    };


    // ============================================
    // INITIALIZE
    // ============================================

    const app =
      initializeApp(firebaseConfig);

    const auth =
      getAuth(app);

    const db =
      getFirestore(app);


    // ============================================
    // ELEMENTS
    // ============================================

    const loginPanel =
      document.getElementById("loginPanel");

    const inbox =
      document.getElementById("inbox");

    const loginForm =
      document.getElementById("loginForm");

    const emailInput =
      document.getElementById("email");

    const passwordInput =
      document.getElementById("password");

    const loginMessage =
      document.getElementById("loginMessage");

    const logoutButton =
      document.getElementById("logoutButton");

    const messagesList =
      document.getElementById("messagesList");


    // ============================================
    // LOGIN
    // ============================================

    loginForm.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();

        loginMessage.textContent =
          "🎮 LOGGING IN...";

        loginMessage.className =
          "message";


        try {

          await signInWithEmailAndPassword(
            auth,
            emailInput.value.trim(),
            passwordInput.value
          );

        } catch (error) {

          console.log("FULL FIREBASE ERROR:", error);

          loginMessage.textContent =
            `${error.code} - ${error.message}`;

          loginMessage.className =
            "message error";

        }

      }
    );


    // ============================================
    // AUTH STATE
    // ============================================

    onAuthStateChanged(
      auth,
      (user) => {

        if (user) {

          // Logged in
          loginPanel.style.display =
            "none";

          inbox.style.display =
            "block";

          loadMessages();

        } else {

          // Logged out
          loginPanel.style.display =
            "block";

          inbox.style.display =
            "none";

          messagesList.innerHTML =
            "";

        }

      }
    );


    // ============================================
    // LOAD MESSAGES
    // ============================================

    function loadMessages() {

      const messagesQuery = query(
        collection(db, "messages"),
        orderBy("createdAt", "desc")
      );


      onSnapshot(
        messagesQuery,
        (snapshot) => {

          messagesList.innerHTML =
            "";


          if (snapshot.empty) {

            messagesList.innerHTML = `
              <div class="empty">
                📭 NO MESSAGES YET.
              </div>
            `;

            return;
          }


          snapshot.forEach(
            (doc) => {

              const data =
                doc.data();


              const rant =
                document.createElement("article");

              rant.className =
                "rant";


              const messageText =
                document.createElement("p");

              messageText.textContent =
                data.message || "";


              const date =
                document.createElement("small");

              if (data.createdAt) {

                date.textContent =
                  "🕐 " +
                  data.createdAt
                    .toDate()
                    .toLocaleString();

              } else {

                date.textContent =
                  "🕐 Just now";

              }


              rant.appendChild(
                messageText
              );

              rant.appendChild(
                date
              );

              messagesList.appendChild(
                rant
              );

            }
          );

        },

        (error) => {

          console.error(
            "Firestore error:",
            error
          );

          messagesList.innerHTML = `
            <div class="empty">
              ❌ COULDN'T LOAD MESSAGES.
            </div>
          `;

        }
      );

    }


    // ============================================
    // LOGOUT
    // ============================================

    logoutButton.addEventListener(
      "click",
      async () => {

        await signOut(auth);

      }
    );

  </script>

</body>
</html>
